name: Build macOS DMG

# Unsigned builds: no Apple Developer certificate or notarization is used.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build unsigned macOS DMG
    runs-on: macos-latest
    defaults:
      run:
        working-directory: factoidl-desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: factoidl-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac -- --x64 --arm64

      - name: List build output
        run: ls -lh release-builds

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: factoidl-desktop-macos-dmg
          path: factoidl-desktop/release-builds/*.dmg
          if-no-files-found: error
          retention-days: 30
