name: Build Windows x64 Installer

# Unsigned builds: no code signing certificate is used.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build unsigned Windows x64 NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: factoidl-desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: factoidl-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Windows icon
        run: npm run generate:win-icon

      - name: Build unsigned installer
        run: npx electron-builder --win --x64

      - name: List build output
        run: dir release-builds

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: factoidl-desktop-windows-x64
          path: factoidl-desktop/release-builds/*.exe
          if-no-files-found: error
          retention-days: 30
