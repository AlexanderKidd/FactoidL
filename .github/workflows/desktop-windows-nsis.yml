name: Build Windows x64 Portable App

# Unsigned builds: no code signing certificate is used.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build unsigned Windows x64 portable app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: factoidl-desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: factoidl-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned portable app
        run: npm run dist:win

      - name: List build output
        run: dir release-builds

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: factoidl-desktop-windows-x64
          path: factoidl-desktop/release-builds/factoidl-desktop-win32-x64-*/**
          if-no-files-found: error
          retention-days: 30
