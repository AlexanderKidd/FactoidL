name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factoidl-desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: factoidl-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run dist:linux

      - name: List build output
        run: ls -lh release-builds

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: factoidl-desktop-linux-appimage
          path: factoidl-desktop/release-builds/*.AppImage
          if-no-files-found: error
          retention-days: 30
